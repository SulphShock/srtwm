[package]
name = "srtwm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
nix = { version = "0.31", features = ["poll"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.14", features = ["extra-traits"] }
xkeysym = "0.2"
